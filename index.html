<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>Provider Dashboard - Auto Photo Stream</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 20px; }
    video { width: 320px; height: 240px; border-radius: 12px; border: 3px solid #22c55e; background: #000; transform: scaleX(-1); /* Front Camera Mirroring */ }
    .status { margin-top: 15px; font-weight: bold; color: #38bdf8; }
  </style>
</head>
<body>

  <h2>প্রোভাইডার ড্যাশবোর্ড (Live Auto Photo Capture)</h2>
  <video id="webcam" autoplay playsinline muted></video>
  <!-- হিডেন ক্যানভাস জেনারেট করে ফটো নেওয়ার জন্য -->
  <canvas id="canvas" style="display:none;"></canvas>
  <p class="status" id="status">ক্যামেরা কানেক্ট হচ্ছে...</p>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // ১. Firebase Configuration (আপনার ফায়ারবেস প্রজেক্টের ক্রিশেনশিয়াল এখানে দিবেন)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const statusText = document.getElementById('status');

    // ২. সেলফি ক্যামেরা এক্সেস করা
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "user", width: 480, height: 360 } 
        });
        video.srcObject = stream;
        statusText.innerText = "ক্যামেরা সচল হয়েছে! লাইভ ফটো পাঠানো হচ্ছে...";

        // ৩. প্রতি ১ সেকেন্ড (১০০০ ms) পরপর ছবি তুলে Firebase-এ পাঠানো
        setInterval(captureAndSendPhoto, 1000);
      } catch (err) {
        statusText.innerText = "ক্যামেরা এক্সেস দেওয়া হয়নি বা কোনো সমস্যা হয়েছে!";
        console.error(err);
      }
    }

    // ৪. ক্যানভাস দিয়ে ফটো ক্যাপচার ও ডাটাবেজে পাঠানো
    function captureAndSendPhoto() {
      const context = canvas.getContext('2d');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      context.drawImage(video, 0, 0, canvas.width, canvas.height);

      // ছবিকে হালকা ফ্রেম কোয়ালিটিতে Base64 ইমেজ ডাটাতে কনভার্ট করা (JPEG, 0.5 Quality)
      const imageData = canvas.toDataURL('image/jpeg', 0.5);

      // Firebase-এ সেভ করা
      database.ref('live_stream/provider_1').set({
        image: imageData,
        timestamp: Date.now()
      });
    }

    // পেজ লোড হলে ক্যামেরা স্টার্ট হবে
    window.onload = startCamera;
  </script>
</body>
</html>
